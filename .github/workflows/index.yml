name: index

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: INDEX.md mentions every example
        run: |
          status=0
          for dir in [0-9][0-9]-*/; do
            grep -q "\`${dir%%-*}-" INDEX.md || { echo "INDEX.md: no row for ${dir%/}"; status=1; }
          done
          exit $status
      - name: lab/check.sh is valid shell
        run: bash -n lab/check.sh
