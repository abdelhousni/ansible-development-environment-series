name: lint-fix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-fix:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 10-ansible-lint-fix-in-the-editor-and-in-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked ansible-lint
        run: |
          python -m venv /tmp/lint
          /tmp/lint/bin/pip install --require-hashes -r requirements.txt
      - name: The --fix table and write_list behave as in the entry
        run: ANSIBLE_LINT=/tmp/lint/bin/ansible-lint ./reproduce-fix.sh | diff expected-fix.txt -
      - name: The example passes, and linting changes nothing
        run: |
          /tmp/lint/bin/ansible-lint
          git diff --exit-code
