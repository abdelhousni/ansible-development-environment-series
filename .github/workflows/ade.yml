name: ade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ade:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 12-collection-venv-with-ansible-dev-environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ade and uv
        run: |
          python -m venv /tmp/tools
          /tmp/tools/bin/pip install ansible-dev-environment==26.9.0 uv==0.12.20
      - name: The constraints lock matches constraints.in
        run: |
          /tmp/tools/bin/uv pip compile constraints.in --python-version 3.12 \
            --exclude-newer 2026-06-01T00:00:00Z -o constraints.txt --quiet
          git diff --exit-code -- constraints.txt
      - name: ade behaves as in the entry
        run: PATH="/tmp/tools/bin:$PATH" ./demo.sh | diff expected-demo.txt -
