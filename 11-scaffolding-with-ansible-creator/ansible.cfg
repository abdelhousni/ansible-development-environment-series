[defaults]
# Specify the inventory file. host_vars/ and group_vars/ next to it are read
# automatically.
inventory = inventory/hosts.yml

# Where ansible-doc and other tools find the project's own collection.
# ansible-playbook already looks in ./collections next to the playbook.
collections_path = ./collections

[persistent_connection]
# Controls how long the persistent connection will remain idle before it is destroyed
connect_timeout=30

# Controls the amount of time to wait for response from remote device before timing out persistent connection
command_timeout=30
